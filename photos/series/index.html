<script>

  try { document.documentElement.dataset.mode = localStorage.getItem('mode') || 'light'; } catch { document.documentElement.dataset.mode = 'light'; }

</script>

<script type="module">
import { SERIES, renderSeries } from '/assets/site.js';
const series = SERIES.find(s => s.slug === new URLSearchParams(location.search).get('s')) || SERIES[0];
document.title = `${series.title} · Chris Truong`;
document.getElementById('seriesTitle').textContent = `${series.title.toLowerCase()}, ${series.when}.`;
document.getElementById('seriesNote').innerHTML = `<span class="todo">${series.note}</span>`;
renderSeries(document.getElementById('plates'), series);
</script>
