<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dark background options</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@300..600&family=Roboto+Mono:wght@400;500;600&family=Young+Serif&display=swap" rel="stylesheet">
<style>
  /* Temporary page for choosing the dark-mode background. Not part of the site. */
  body { margin: 0; background: #888; font: 15px/1.5 "Lexend Deca", sans-serif; }
  h1 { font: 500 14px "Roboto Mono", monospace; color: #fff; margin: 0; padding: 18px 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  .opt { padding: 26px 22px 30px; color: #f2efea; }
  .opt h2 { font: 500 13px "Roboto Mono", monospace; margin: 0 0 18px; opacity: .65; }
  .name { font: 400 26px "Young Serif", serif; margin: 0 0 16px; }
  .wins { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
  .win { height: 90px; border-radius: 10px; box-shadow: 0 14px 30px -14px rgba(0,0,0,.6); font: 500 11px "Roboto Mono", monospace; padding: 8px; color: #fff; }
  .acc { font: 400 21px "Young Serif", serif; }
  .acc span { margin-right: 12px; }
  p { color: #dcd8d1; margin: 14px 0 0; font-weight: 330; }
  .row { display: flex; gap: 10px; margin-top: 16px; }
  .panel { flex: 1; padding: 12px 14px; border-radius: 12px; font-size: 13px; }
</style>
</head>
<body>
<h1>Dark background options with your three themes (Sweden, Bento, Miami)</h1>
<div class="grid" id="grid"></div>
<script>
  // [label, page, quiet panel, Purrmodoro night card]
  const OPTIONS = [
    ['A · ink navy', '#171c28', '#202638', '#2a2c50'],
    ['B · plum night', '#1f1a24', '#29232f', '#2d2848'],
    ['C · graphite (now)', '#222126', '#2b2a30', '#2a2748'],
  ];
  const WINDOWS = [['sweden', '#0058a3'], ['bento', '#2d394d'], ['miami', '#f35588']];
  const ACCENTS = [['Truong', '#3d8fe0'], ['made', '#ff7a90'], ['noticed', '#f35588']];
  document.getElementById('grid').innerHTML = OPTIONS.map(([label, bg, tint, purr]) => `
    <div class="opt" style="background:${bg}">
      <h2>${label} · ${bg}</h2>
      <div class="name">Chris <span style="color:#3d8fe0">Truong</span></div>
      <div class="wins">${WINDOWS.map(([n, c]) => `<div class="win" style="background:${c}">${n}</div>`).join('')}</div>
      <div class="acc">${ACCENTS.map(([w, c]) => `<span style="color:${c}">${w}</span>`).join('')}</div>
      <p>I'm Chris, a product and design ops lead in Baltimore. I grew up in Houston, the son of Vietnamese refugees, and I like making things that feel good to use.</p>
      <div class="row"><div class="panel" style="background:${tint}">quiet panel</div><div class="panel" style="background:${purr};color:#f3e9dc">Purrmodoro card</div></div>
    </div>`).join('');
</script>
</body>
</html>
