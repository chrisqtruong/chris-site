        - generic [ref=e44]: Why
        - generic [ref=e45]:
          - heading "a timer that doesn’t feel like homework" [level=2] [ref=e46]
          - paragraph [ref=e47]: My wife works across lots of different tasks. She wanted a simple rhythm (focus, break, focus) and a gentle way to see how much focused time she’d put in. The apps out there were either bland or overloaded.
          - paragraph [ref=e48]: "Add a line of your own: what made you decide to build it yourself, and how she reacted when she first opened it."
      - generic [ref=e49]:
        - generic [ref=e50]: Principles
        - generic [ref=e51]:
          - heading "five rules i wrote before anything else" [level=2] [ref=e52]
          - list [ref=e53]:
            - listitem [ref=e54]:
              - generic [ref=e55]: Open, tap, focusing. It should never need setup to use.
            - listitem [ref=e56]:
              - generic [ref=e57]: Task-agnostic. No categories, labels or to-dos.
            - listitem [ref=e58]:
              - generic [ref=e59]: She’s in control. Nothing starts without a tap.
            - listitem [ref=e60]:
              - generic [ref=e61]: Lightweight. No third-party libraries, no accounts, no servers.
            - listitem [ref=e62]:
              - generic [ref=e63]: Delight in small doses. Smooth animations and haptics, never in the way.
      - generic [ref=e64]:
        - generic [ref=e65]: Character
        - generic [ref=e66]:
          - heading "her room follows the real clock" [level=2] [ref=e67]
          - paragraph [ref=e68]: The cat sits at her desk inside the timer ring. By day she wears a white coat and has an iced coffee; after sunset it’s pajamas, round glasses, a warm lamp and tea. The window shows the actual time of day, from dawn colors to stars. Everything is drawn in code, no image files.
          - 'img "The cat''s moods, day and night: idle, focus, break, done" [ref=e69]'
          - paragraph [ref=e70]: When she’s not focusing, you can pet her. Ears flick, a nose boop gets >_<, a paw tap gets a wave, and one in ten belly rubs gets a rare purr.
      - generic [ref=e71]:
        - generic [ref=e72]: Scope
        - generic [ref=e73]:
          - heading "what i left out, on purpose" [level=2] [ref=e74]
          - paragraph [ref=e75]: "Task lists, categories, accounts, sync, ambient music and an Apple Watch app all stayed out of version one. A few ideas are tabled for later:"
          - list [ref=e76]:
            - listitem [ref=e77]: Ring even on silent, with Apple’s new alarm tools.
            - listitem [ref=e78]: "Collectibles: treats, outfits and rare cats earned through focus time. Her full history is saved, so they can be awarded retroactively."
            - listitem [ref=e79]: Real weather in the cat’s window.
